name: Garmin Sync
version: "1.2.0"
slug: garmin-sync
description: >
  Syncs Garmin Connect health data to PostgreSQL. Set mode to
  routine, backfill, or auth. backfill_start only used in backfill mode.
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
hassio_api: false
homeassistant_api: false
options:
  garmin_email: ""
  garmin_password: ""
  garmin_token_json: ""
  database_url: ""
  mode: routine
  sync_interval_min: 30
  backfill_start: ""
  data_types: ""
schema:
  garmin_email: str
  garmin_password: password
  garmin_token_json: str
  database_url: str
  mode: str
  sync_interval_min: int(5,1440)
  backfill_start: str
  data_types: str
