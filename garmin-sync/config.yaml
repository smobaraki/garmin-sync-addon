name: Garmin Sync
version: "1.1.0"
slug: garmin-sync
description: >
  Syncs Garmin Connect health data to PostgreSQL. Choose mode:
  routine (today only), backfill (date range), or auth (login).
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
hassio_api: false
homeassistant_api: false
options:
  garmin_email: ""
  garmin_password: ""
  garmin_token_json: ""
  database_url: ""
  mode: routine
  sync_interval_min: 30
  backfill_start: ""
  data_types: ""
schema:
  garmin_email: str
  garmin_password: password
  garmin_token_json: str
  database_url: str
  mode: list(routine|backfill|auth)
  sync_interval_min: int(5,1440)
  backfill_start: str
  data_types: str
